limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
server {
 listen 80;
 client_max_body_size 1m;
 location /actuator { return 404; }
 location / { limit_req zone=api burst=60 nodelay; proxy_pass http://app:8080; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Host $host; }
}
