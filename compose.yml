name: hrms
services:
  mysql:
    image: mysql:8.4.7
    environment:
      MYSQL_DATABASE: hrms
      MYSQL_USER: hrms
      MYSQL_PASSWORD: ${DB_PASSWORD:?set .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set .env}
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4.6-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: hrms
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?set .env}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:mysql://mysql:3306/hrms?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USER: hrms
      DB_PASSWORD: ${DB_PASSWORD:?set .env}
      REDIS_HOST: redis
      RABBIT_HOST: rabbitmq
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:?set .env}
      JWT_SECRET: ${JWT_SECRET:?set .env}
      CALLBACK_SECRET: ${CALLBACK_SECRET:?set .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?set .env}
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:8081:8081"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
  nginx:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8088:80"]
    volumes: ["./ops/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/v3/api-docs"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mysql-data:
  rabbit-data:
