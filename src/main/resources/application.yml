spring:
  application:
    name: hrms
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hrms?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:hrms}
    password: ${DB_PASSWORD:hrms-local}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 3000
      transaction-isolation: TRANSACTION_READ_COMMITTED
      connection-init-sql: SET SESSION innodb_lock_wait_timeout=5
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 300ms
      connect-timeout: 300ms
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:hrms}
    password: ${RABBIT_PASSWORD:hrms-local}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        concurrency: 2
        max-concurrency: 4
        default-requeue-rejected: false
  jackson:
    time-zone: UTC
server:
  port: 8080
  tomcat:
    threads:
      max: 100
    accept-count: 100
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.95,0.99
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
hrms:
  jwt-secret: ${JWT_SECRET}
  callback-secret: ${CALLBACK_SECRET}
  jobs-enabled: ${JOBS_ENABLED:true}
  booking-ttl-seconds: 900
